# ═══════════════════════════════════════════════════════════════
# Práctica 12 Parte 2 — Portal Webmail Roundcube
# Complemento al stack de mailserver (tarea12)
# ═══════════════════════════════════════════════════════════════
#
# Servicios nuevos:
#   roundcube  — Cliente webmail PHP (puerto 80)
#   mariadb    — BD para preferencias, contactos y sesiones
#
# Red: mail_network (compartida con mailserver)
# Volúmenes: roundcube_db, roundcube_data
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # 1. BASE DE DATOS DEL PORTAL — MariaDB
  # ─────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11-jammy
    container_name: mariadb_webmail
    restart: always

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE:      ${DB_NAME}
      MARIADB_USER:          ${DB_USER}
      MARIADB_PASSWORD:      ${DB_PASSWORD}

    expose:
      - "3306"

    volumes:
      - roundcube_db:/var/lib/mysql

    networks:
      - mail_network

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # 2. PORTAL WEBMAIL — Roundcube
  # ─────────────────────────────────────────────────────────────
  roundcube:
    image: roundcube/roundcubemail:latest-apache
    container_name: roundcube_webmail
    restart: always

    ports:
      - "80:80"

    environment:
      # ── Conexión a MariaDB ──────────────────────────────────
      ROUNDCUBEMAIL_DB_TYPE:     mysql
      ROUNDCUBEMAIL_DB_HOST:     mariadb
      ROUNDCUBEMAIL_DB_PORT:     3306
      ROUNDCUBEMAIL_DB_NAME:     ${DB_NAME}
      ROUNDCUBEMAIL_DB_USER:     ${DB_USER}
      ROUNDCUBEMAIL_DB_PASSWORD: ${DB_PASSWORD}

      # ── Conexión al servidor de correo ──────────────────────
      ROUNDCUBEMAIL_DEFAULT_HOST:   tls://mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT:   993
      ROUNDCUBEMAIL_SMTP_SERVER:    tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT:      587

      # ── Seguridad de sesión ─────────────────────────────────
      ROUNDCUBEMAIL_DES_KEY:        ${SESSION_KEY}
      ROUNDCUBEMAIL_SESSION_LIFETIME: 10

      # ── Personalización institucional ───────────────────────
      ROUNDCUBEMAIL_PRODUCT_NAME:   "reprobados.com Webmail"
      ROUNDCUBEMAIL_USERNAME_DOMAIN: reprobados.com

      # ── TLS — manejado por config.inc.php ───────────────────
      ROUNDCUBEMAIL_IMAP_AUTH_TYPE: LOGIN
      ROUNDCUBEMAIL_SMTP_AUTH_TYPE: LOGIN

    volumes:
      - roundcube_data:/var/roundcube/db
      - ./roundcube/config.inc.php:/var/roundcube/config/config.inc.php:ro

    networks:
      - mail_network

    depends_on:
      mariadb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ─────────────────────────────────────────────────────────────
# VOLÚMENES
# ─────────────────────────────────────────────────────────────
volumes:
  roundcube_db:
    name: roundcube_db
    driver: local

  roundcube_data:
    name: roundcube_data
    driver: local

# ─────────────────────────────────────────────────────────────
# RED COMPARTIDA CON MAILSERVER
# ─────────────────────────────────────────────────────────────
networks:
  mail_network:
    name: mail_network
    external: true