version: "3.8"

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.reprobados.com
    domainname: reprobados.com
    env_file: mailserver.env
    ports:
      - "25:25"       # SMTP
      - "465:465"     # SMTPS (SSL)
      - "587:587"     # SMTP submission (TLS)
      - "993:993"     # IMAPS
      - "143:143"     # IMAP STARTTLS
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - ./config:/tmp/docker-mailserver
      - ./certs:/etc/letsencrypt/live/mail.reprobados.com:ro
    restart: always
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "ss", "-lntp", "|", "grep", "-q", ":25"]
      timeout: 3s
      retries: 3

volumes:
  mail_data:
    name: mail_data
  mail_state:
    name: mail_state
  mail_logs:
    name: mail_logs
