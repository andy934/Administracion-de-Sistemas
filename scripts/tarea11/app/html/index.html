<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Server — Interno</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap');

  :root {
    --naranja: #ff9d00;
    --rojo:    #ff4d6d;
    --fondo:   #0a060f;
    --panel:   #150d20;
    --borde:   #2a1a3a;
    --texto:   #d8c8e8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,157,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,157,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    color: var(--naranja);
    letter-spacing: 0.3em;
    border: 1px solid var(--naranja);
    padding: 0.3rem 1rem;
    border-radius: 2px;
    margin-bottom: 1.5rem;
    opacity: 0.8;
  }

  h1 {
    font-size: 2.6rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--naranja), var(--rojo));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 0.6rem;
  }

  .sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: #4a3a6a;
    letter-spacing: 0.15em;
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .info-box {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-left: 3px solid var(--naranja);
    border-radius: 6px;
    padding: 1.4rem 2rem;
    width: min(500px, 88vw);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.82rem;
    line-height: 2;
    color: #7a6a9a;
  }

  .info-box span { color: var(--naranja); }

  .warning {
    margin-top: 2rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    color: var(--rojo);
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="badge">// SERVICIO INTERNO — SIN ACCESO PÚBLICO</div>

<h1>App Server<br>Interno</h1>
<div class="sub">ACCESO VÍA PROXY NGINX · red_publica</div>

<div class="info-box">
  <div>CONTENEDOR  <span>app_server</span></div>
  <div>RED         <span>red_publica</span></div>
  <div>PUERTO      <span>80 (solo interno)</span></div>
  <div>PROXY       <span>nginx → /app/</span></div>
  <div>HOST EXPUESTO <span>NO</span></div>
  <div>ESTADO      <span>OPERATIVO</span></div>
</div>

<div class="warning">
  ⚠ Este servicio no tiene puertos mapeados al host.
  Solo nginx puede alcanzarlo.
</div>

</body>
</html>
