# ═══════════════════════════════════════════════════════════════
# Práctica 11 — Orquestación Multicapa con Docker Compose
# Autor: Administración de Sistemas 2026 — reprobados.local
# ═══════════════════════════════════════════════════════════════
#
# Servicios:
#   nginx        — Balanceador / único punto de entrada público
#   app_server   — Aplicación interna (sin puertos expuestos)
#   db_server    — PostgreSQL (solo red_datos)
#   pgadmin      — Panel administrativo (solo vía túnel SSH)
#
# Redes:  red_publica | red_datos
# Volúmenes: db_data | pgadmin_data
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # 1. BALANCEADOR / FRONTEND — Nginx (único punto público)
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_balanceador
    restart: always

    ports:
      - "${NGINX_PORT}:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro

    networks:
      - red_publica

    depends_on:
      app_server:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # 2. SERVIDOR DE APLICACIONES — Accesible solo desde nginx
  # ─────────────────────────────────────────────────────────────
  app_server:
    image: nginx:alpine
    container_name: app_server
    restart: always

    # SIN puertos expuestos al host — solo accesible por nginx
    expose:
      - "80"

    volumes:
      - ./app/html:/usr/share/nginx/html:ro

    networks:
      - red_publica

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # 3. BASE DE DATOS — PostgreSQL (aislada en red_datos)
  # ─────────────────────────────────────────────────────────────
  db_server:
    image: postgres:16-alpine
    container_name: db_server
    restart: always

    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata

    # Sin puertos expuestos — invisible fuera de red_datos
    expose:
      - "5432"

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - red_datos

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # 4. PANEL ADMINISTRATIVO — pgAdmin (solo vía túnel SSH)
  # ─────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    # Puerto mapeado al host pero bloqueado por firewall
    # Accesible SOLO mediante túnel SSH local
    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - red_datos

    depends_on:
      db_server:
        condition: service_healthy

# ─────────────────────────────────────────────────────────────
# VOLÚMENES PERSISTENTES
# ─────────────────────────────────────────────────────────────
volumes:
  db_data:
    name: db_data
    driver: local

  pgadmin_data:
    name: pgadmin_data
    driver: local

# ─────────────────────────────────────────────────────────────
# REDES MULTICAPA
# ─────────────────────────────────────────────────────────────
networks:
  red_publica:
    name: red_publica
    driver: bridge

  red_datos:
    name: red_datos
    driver: bridge
    internal: true    # ← completamente aislada del exterior