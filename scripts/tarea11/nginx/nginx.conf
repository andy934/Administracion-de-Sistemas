user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Ocultar versión del servidor ───────────────────────────
    server_tokens off;

    # ── Cabeceras de seguridad ─────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"             always;
    add_header X-Content-Type-Options "nosniff"                always;
    add_header X-XSS-Protection       "1; mode=block"          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Resolver DNS interno de Docker ─────────────────────────
    # 127.0.0.11 es el DNS embebido de Docker.
    # Resuelve nombres de contenedor en cada request (runtime),
    # evitando el error "host not found in upstream" al arrancar.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Logging ────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Servidor principal ─────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Página de inicio del balanceador
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        # Proxy hacia el servidor de aplicaciones interno
        # Variable necesaria para que nginx use el resolver en runtime
        location /app/ {
            set $upstream http://app_server:80;
            proxy_pass         $upstream/;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_hide_header  X-Powered-By;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}